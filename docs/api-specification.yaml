---
# Generated from the real router inventory in docs/api-routes.generated.txt.
# Every `paths:` entry below corresponds to a route the gorilla/mux router
# actually registers. Path parameters are written without the mux regular
# expression constraint, so `/secrets/{secret_id:[A-Fa-f0-9-]+}` in the
# inventory appears here as `/secrets/{secret_id}`.
#
# RocketVault registers most data-plane resources twice: once under a legacy
# flat path (`/api/v1/secrets`) that resolves to the default vault, and once
# under a vault-scoped path (`/api/v1/vaults/{vault_name}/secrets`). Both
# forms are separate registered routes and both are documented here.
openapi: 3.0.3
info:
  title: RocketVault API
  description: |
    A self-hosted, open-source alternative to Azure Key Vault: secrets
    management, cryptographic key operations, X.509 certificate lifecycle
    management, and multi-vault RBAC.
  version: 4.0.0
  contact:
    name: RocketVault
    url: https://github.com/Snehal1112/rocketvault
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Development server
  - url: https://api.rocketvault.local
    description: Production server

security:
  - bearerAuth: []

tags:
  - name: Health
    description: Liveness, readiness, and database health probes
  - name: Monitoring
    description: Prometheus metrics scraping
  - name: Configuration
    description: Non-sensitive front-end configuration
  - name: Authentication
    description: Login, token refresh, and session management
  - name: Users
    description: User administration
  - name: Service Accounts
    description: OAuth2 client-credentials machine identities
  - name: OIDC
    description: OpenID Connect authorization-code login
  - name: JWKS
    description: JSON Web Key Set publication and signing-key rotation
  - name: Secrets
    description: Secret storage, versioning, import/export, and backup
  - name: Keys
    description: Cryptographic key lifecycle and crypto operations
  - name: Certificates
    description: X.509 certificate lifecycle and policy
  - name: Soft Delete
    description: Listing, restoring, and purging soft-deleted items
  - name: Vaults
    description: Vault lifecycle management
  - name: Role Assignments
    description: Per-vault Azure-parity role grants
  - name: Access Policies
    description: Explicit allow/deny policies evaluated before role grants
  - name: Vault Provisioning Grants
    description: |
      Admin-only, non-delegable bounded rights to create vaults -- the
      once-per-customer alternative to a once-per-vault support ticket
  - name: Audit
    description: Audit log queries and compliance reports

paths:
  # ─── JWKS (public, outside /api/v1) ────────────────────────────────────────
  /jwks.json:
    get:
      summary: Get the JSON Web Key Set
      description: |
        Returns an RFC 7517 JWK Set containing every active public signing key.
        Public endpoint; no authentication required.
      operationId: getJWKS
      tags:
        - JWKS
      security: []
      responses:
        "200":
          description: JWK Set retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKSet"
        "500":
          description: Failed to build the JWK set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"
        "503":
          description: Signing provider not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"

  /api/v1/jwks/rotate:
    post:
      summary: Rotate the JWT signing key
      description: |
        Generates a new signing key and returns its key ID plus the overlap
        deadline during which the previous key still validates tokens. Only
        supported by the `self_pki` key source. Admin role required.
      operationId: rotateJWKS
      tags:
        - JWKS
      responses:
        "200":
          description: Signing key rotated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKSRotateResponse"
        "400":
          description: Rotation is not supported by the configured key source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  # ─── Monitoring (public, outside /api/v1) ──────────────────────────────────
  /metrics:
    get:
      summary: Scrape Prometheus metrics
      description: |
        Returns process and application metrics in Prometheus text exposition
        format. Registered on the unversioned root path (not under
        `/api/v1`), matching Prometheus scrape conventions. Only registered
        when `monitoring.enable_metrics` is true; otherwise the route does
        not exist and requests 404. Public endpoint; no authentication
        required.
      operationId: getMetrics
      tags:
        - Monitoring
      security: []
      responses:
        "200":
          description: Metrics retrieved successfully
          content:
            text/plain; version=0.0.4; charset=utf-8:
              schema:
                type: string

  # ─── Configuration ─────────────────────────────────────────────────────────
  /api/v1/config:
    get:
      summary: Get front-end configuration
      description: |
        Returns the non-sensitive configuration the front end needs. Values are
        populated at startup; no work is done at request time.
      operationId: getConfig
      tags:
        - Configuration
      security: []
      responses:
        "200":
          description: Configuration retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrontendConfig"

  # ─── Health ────────────────────────────────────────────────────────────────
  /api/v1/health:
    get:
      summary: Get comprehensive health metrics
      description: |
        Returns detailed system health information including memory usage,
        goroutine and CPU statistics, database connection-pool statistics, and
        query performance metrics.
      operationId: getHealth
      tags:
        - Health
      security: []
      responses:
        "200":
          description: Health metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          description: Failed to collect health metrics
          content:
            text/plain:
              schema:
                type: string

  /api/v1/health/ready:
    get:
      summary: Check system readiness
      description: |
        Performs a readiness check to determine if the system is ready to
        accept traffic.
      operationId: getHealthReady
      tags:
        - Health
      security: []
      responses:
        "200":
          description: System is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: System is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /api/v1/health/live:
    get:
      summary: Check system liveness
      description: |
        Performs a liveness check to determine if the application is running
        properly.
      operationId: getHealthLive
      tags:
        - Health
      security: []
      responses:
        "200":
          description: System is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"

  /api/v1/health/database:
    get:
      summary: Check database health
      description: |
        Returns connection-pool utilisation and query-performance detail for
        the configured database. Responds 503 when the reported status is
        `warning`, `degraded`, or `critical`.
      operationId: getHealthDatabase
      tags:
        - Health
      security: []
      responses:
        "200":
          description: Database is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseHealthResponse"
        "503":
          description: Database is degraded, in warning, or critical
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseHealthResponse"

  # ─── Authentication ────────────────────────────────────────────────────────
  /api/v1/users/login:
    post:
      summary: Authenticate a user
      description: |
        Authenticates with username, password, and TOTP code, returning an
        access token and a refresh token. Public endpoint.
      operationId: loginUser
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/users/refresh:
    post:
      summary: Refresh an access token
      description: Exchanges a valid refresh token for a new access token. Public endpoint.
      operationId: refreshToken
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Access token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Token refresh failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/users/sessions:
    get:
      summary: List the current user's sessions
      description: Returns every active session belonging to the authenticated user.
      operationId: listUserSessions
      tags:
        - Authentication
      responses:
        "200":
          description: Sessions retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSessionsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      summary: Revoke all of the current user's sessions
      description: Revokes every session belonging to the authenticated user.
      operationId: revokeAllSessions
      tags:
        - Authentication
      responses:
        "200":
          $ref: "#/components/responses/StatusOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    delete:
      summary: Revoke a single session
      description: Revokes the identified session.
      operationId: revokeSession
      tags:
        - Authentication
      responses:
        "200":
          $ref: "#/components/responses/StatusOK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ─── Users ─────────────────────────────────────────────────────────────────
  /api/v1/users:
    post:
      summary: Create a user
      description: Creates a new user and returns its provisioned TOTP secret. Admin role required.
      operationId: createUser
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      summary: List users
      description: Returns a paginated list of all users. Admin role required.
      operationId: listUsers
      tags:
        - Users
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListUsersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/{user_id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      summary: Get a user
      description: Returns a user by ID. Callers may read their own profile; admins may read any.
      operationId: getUser
      tags:
        - Users
      responses:
        "200":
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Update a user
      description: |
        Updates a user's username, password, or roles. Callers may update their
        own profile but not their own roles; admins may update any user.
      operationId: updateUser
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      summary: Delete a user
      description: Permanently deletes a user. Admin role required; self-deletion is rejected.
      operationId: deleteUser
      tags:
        - Users
      responses:
        "200":
          $ref: "#/components/responses/StatusOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Service accounts and OAuth2 ───────────────────────────────────────────
  /api/v1/oauth2/token:
    post:
      summary: Issue a service-account access token
      description: |
        RFC 6749 §4.4 client-credentials grant. Credentials may be supplied via
        HTTP Basic authentication or as form fields. The body must be
        `application/x-www-form-urlencoded`.
      operationId: issueOAuth2Token
      tags:
        - Service Accounts
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OAuth2TokenRequest"
      responses:
        "200":
          description: Access token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuth2TokenResponse"
        "400":
          description: Malformed request or unsupported grant type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuth2ErrorResponse"
        "401":
          description: Client authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuth2ErrorResponse"
        "500":
          description: Authorization server temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuth2ErrorResponse"

  /api/v1/service-accounts:
    post:
      summary: Create a service account
      description: |
        Creates an OAuth2 client-credentials identity and returns the plain-text
        client secret once only. Admin role required.
      operationId: createServiceAccount
      tags:
        - Service Accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceAccountRequest"
      responses:
        "201":
          description: Service account created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAccountWithSecret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      summary: List service accounts
      description: Returns all service accounts. Admin role required.
      operationId: listServiceAccounts
      tags:
        - Service Accounts
      responses:
        "200":
          description: Service accounts retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListServiceAccountsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/service-accounts/{service_account_id}:
    parameters:
      - $ref: "#/components/parameters/ServiceAccountId"
    get:
      summary: Get a service account
      description: Returns a single service account by ID. Admin role required.
      operationId: getServiceAccount
      tags:
        - Service Accounts
      responses:
        "200":
          description: Service account retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a service account
      description: Permanently deletes a service account. Admin role required.
      operationId: deleteServiceAccount
      tags:
        - Service Accounts
      responses:
        "200":
          $ref: "#/components/responses/StatusOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/service-accounts/{service_account_id}/rotate:
    parameters:
      - $ref: "#/components/parameters/ServiceAccountId"
    post:
      summary: Rotate a service account's client secret
      description: |
        Issues a new client secret and invalidates the old one. The new secret
        is returned once only. Admin role required.
      operationId: rotateServiceAccountSecret
      tags:
        - Service Accounts
      responses:
        "200":
          description: Client secret rotated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSecretResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  # ─── OIDC ──────────────────────────────────────────────────────────────────
  /api/v1/oidc/login:
    get:
      summary: Start an OIDC login
      description: |
        Stores a random state and nonce in short-lived cookies and redirects to
        the configured provider's authorization endpoint. Supplying
        `cli_redirect_uri` (restricted to `http://127.0.0.1:<port>` or
        `http://localhost:<port>`) switches on the CLI loopback flow.
      operationId: oidcLogin
      tags:
        - OIDC
      security: []
      parameters:
        - name: cli_redirect_uri
          in: query
          required: false
          description: Loopback redirect target for the CLI login flow
          schema:
            type: string
            example: "http://127.0.0.1:53682/callback"
      responses:
        "302":
          description: Redirect to the provider's authorization endpoint
        "400":
          description: Invalid cli_redirect_uri
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Failed to generate state or nonce
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: OIDC is not configured
          content:
            text/plain:
              schema:
                type: string

  /api/v1/oidc/callback:
    get:
      summary: Complete an OIDC login
      description: |
        Verifies state, exchanges the authorization code, verifies the ID token
        nonce, finds or creates the local user, and issues the same session
        pair `POST /api/v1/users/login` returns. When the login began with a
        `cli_redirect_uri`, the session is handed off via a one-time exchange
        code instead of being returned directly.
      operationId: oidcCallback
      tags:
        - OIDC
      security: []
      parameters:
        - name: code
          in: query
          required: true
          description: Authorization code returned by the provider
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: Opaque state value; must match the oidc_state cookie
          schema:
            type: string
      responses:
        "200":
          description: Session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "302":
          description: Redirect to the CLI loopback URI carrying a one-time exchange code
        "400":
          description: Missing cookie, state mismatch, or missing code
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: OIDC callback failed
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Failed to resolve the user or issue a session
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: OIDC is not configured
          content:
            text/plain:
              schema:
                type: string

  /api/v1/oidc/cli/exchange:
    post:
      summary: Redeem a CLI login exchange code
      description: |
        Redeems the one-time code minted by the OIDC callback for the session it
        stands in for. Codes are single-use and expire after 60 seconds.
      operationId: oidcCLIExchange
      tags:
        - OIDC
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CLIExchangeRequest"
      responses:
        "200":
          description: Session returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Missing code
          content:
            text/plain:
              schema:
                type: string
        "410":
          description: Unknown or expired code
          content:
            text/plain:
              schema:
                type: string

  # ─── Audit ─────────────────────────────────────────────────────────────────
  /api/v1/audit/logs:
    get:
      summary: Query audit logs
      description: |
        Returns a page of audit log entries plus a hash-chain integrity flag.
        Admin role required.
      operationId: getAuditLogs
      tags:
        - Audit
      parameters:
        - name: from
          in: query
          required: false
          description: Lower bound of the time range (RFC 3339)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Upper bound of the time range (RFC 3339)
          schema:
            type: string
            format: date-time
        - name: user_id
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: outcome
          in: query
          required: false
          schema:
            type: string
        - name: resource_type
          in: query
          required: false
          schema:
            type: string
        - name: resource_id
          in: query
          required: false
          schema:
            type: string
        - name: source
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum entries to return; defaults to 100, capped at 1000
          schema:
            type: integer
            default: 100
            maximum: 1000
      responses:
        "200":
          description: Audit logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/audit/reports/soc2:
    get:
      summary: Generate a SOC 2 report
      description: |
        Summarises audit activity across the requested window. Returns JSON by
        default and CSV when `Accept: text/csv` is sent. Admin role required.
      operationId: getSOC2Report
      tags:
        - Audit
      parameters:
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
      responses:
        "200":
          description: Report generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SOC2Report"
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/audit/reports/gdpr:
    get:
      summary: Generate a GDPR data-subject report
      description: |
        Returns every audit event touching the named data subject in the
        requested window. Returns JSON by default and CSV when
        `Accept: text/csv` is sent. Admin role required.
      operationId: getGDPRReport
      tags:
        - Audit
      parameters:
        - name: subject_id
          in: query
          required: true
          description: Identifier of the data subject
          schema:
            type: string
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
      responses:
        "200":
          description: Report generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GDPRReport"
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/audit/config:
    get:
      summary: Get the audit retention configuration
      description: Returns the number of days audit entries are retained. Admin role required.
      operationId: getAuditConfig
      tags:
        - Audit
      responses:
        "200":
          description: Retention configuration retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      summary: Update the audit retention configuration
      description: Sets the number of days audit entries are retained. Admin role required.
      operationId: patchAuditConfig
      tags:
        - Audit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditConfig"
      responses:
        "200":
          description: Retention configuration updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  # ─── Access policies ───────────────────────────────────────────────────────
  /api/v1/access-policies:
    get:
      summary: List access policies
      description: Returns every access policy. Admin role required.
      operationId: listAccessPolicies
      tags:
        - Access Policies
      responses:
        "200":
          description: Access policies retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAccessPoliciesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Create an access policy
      description: |
        Creates an explicit allow or deny policy. An empty `vault_id` leaves the
        policy global; a value scopes it to that vault. Admin role required.
      operationId: createAccessPolicy
      tags:
        - Access Policies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccessPolicyRequest"
      responses:
        "201":
          description: Access policy created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/access-policies/{policy_id}:
    parameters:
      - $ref: "#/components/parameters/PolicyId"
    get:
      summary: Get an access policy
      description: Returns a single access policy by ID. Admin role required.
      operationId: getAccessPolicy
      tags:
        - Access Policies
      responses:
        "200":
          description: Access policy retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Update an access policy's effect
      description: Changes the policy's effect between `allow` and `deny`. Admin role required.
      operationId: updateAccessPolicy
      tags:
        - Access Policies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccessPolicyRequest"
      responses:
        "200":
          description: Access policy updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete an access policy
      description: Permanently removes an access policy. Admin role required.
      operationId: deleteAccessPolicy
      tags:
        - Access Policies
      responses:
        "200":
          $ref: "#/components/responses/StatusOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/access-policies/principal/{principal_id}:
    parameters:
      - $ref: "#/components/parameters/PrincipalId"
    get:
      summary: List a principal's access policies
      description: Returns every access policy attached to the named principal. Admin role required.
      operationId: listAccessPoliciesByPrincipal
      tags:
        - Access Policies
      responses:
        "200":
          description: Access policies retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAccessPoliciesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  # ─── Vault Provisioning Grants ────────────────────────────────────────────
  /api/v1/vault-provisioning-grants:
    get:
      summary: List provisioning grants
      description: |
        Returns every provisioning grant. Admin role required -- this tier is
        deliberately non-delegable: a principal able to amend grants could
        raise its own quota, and the bound the grant exists to impose would
        be decorative.
      operationId: listVaultProvisioningGrants
      tags:
        - Vault Provisioning Grants
      responses:
        "200":
          description: Provisioning grants retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VaultProvisioningGrant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/vault-provisioning-grants/{principal_id}:
    parameters:
      - $ref: "#/components/parameters/PrincipalId"
    put:
      summary: Issue or re-quota a provisioning grant
      description: |
        Issues a new grant, or changes the quota of an existing one --
        `principal_id` is UNIQUE, so a second PUT for the same principal is a
        quota change, not a second right. Returns 201 on first issue, 200 on
        re-quota. Admin role required.
      operationId: upsertVaultProvisioningGrant
      tags:
        - Vault Provisioning Grants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueGrantRequest"
      responses:
        "200":
          description: Existing grant re-quotaed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultProvisioningGrant"
        "201":
          description: Grant issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultProvisioningGrant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      summary: Revoke a provisioning grant
      description: |
        Revokes the principal's provisioning grant. Does NOT cascade: it
        stops future vault creation only, and deliberately leaves the
        principal's existing vaults, and its rights over them, intact.
        Admin role required.
      operationId: deleteVaultProvisioningGrant
      tags:
        - Vault Provisioning Grants
      responses:
        "204":
          description: Grant revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  # ─── Vaults ────────────────────────────────────────────────────────────────
  /api/v1/vaults:
    get:
      summary: List vaults
      description: |
        Returns every vault. Requires the admin role or a global `vaults/manage`
        allow policy — a vault-scoped grant is not sufficient.
      operationId: listVaults
      tags:
        - Vaults
      parameters:
        - name: include_deleted
          in: query
          required: false
          description: Include soft-deleted vaults when set to `true`
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Vaults retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListVaultsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Create a vault
      description: |
        Creates a new vault. Requires the admin role or a global `vaults/manage`
        allow policy — a vault-scoped grant on another vault is not sufficient.
      operationId: createVault
      tags:
        - Vaults
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVaultRequest"
      responses:
        "201":
          description: Vault created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/vaults/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: Name of the vault
        schema:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{1,61}[a-z0-9])$"
          example: "production"
    get:
      summary: Get a vault
      description: |
        Returns a vault by name. Authorized against the named vault itself, not
        the default vault.
      operationId: getVault
      tags:
        - Vaults
      responses:
        "200":
          description: Vault retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      summary: Update a vault
      description: |
        Updates a vault's enabled flag, purge protection, retention period, or
        tags. Nil fields are left unchanged; an empty tag map clears all tags.
      operationId: updateVault
      tags:
        - Vaults
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVaultRequest"
      responses:
        "200":
          description: Vault updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Soft-delete a vault
      description: |
        Soft-deletes a vault and cascades to its secrets, keys, and
        certificates. The default vault cannot be deleted.
      operationId: deleteVault
      tags:
        - Vaults
      responses:
        "204":
          description: Vault soft-deleted successfully
        "400":
          description: The default vault is protected from deletion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/vaults/{name}/webhook:
    parameters:
      - name: name
        in: path
        required: true
        description: Name of the vault
        schema:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{1,61}[a-z0-9])$"
          example: "production"
    put:
      summary: Create or update a vault's webhook config
      description: |
        Creates or updates the vault's webhook notification target.
        Authorized against the named vault itself (`vaults/manage`), the same
        as the other `/vaults/{name}` management routes.

        The server always mints the signing secret; there is no
        client-supplied secret field. `rotate_secret: true` replaces an
        existing secret. `enabled` is omittable to leave the current value
        (or default to `true` on create) rather than silently disabling the
        webhook by omission.

        The response carries `signing_secret` in plaintext only on the call
        that mints one — the first create, or any update with
        `rotate_secret: true`. It is shown exactly once: the secret is stored
        encrypted, and no endpoint (including the GET below) ever returns it
        again after this response.
      operationId: upsertVaultWebhook
      tags:
        - Vaults
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertVaultWebhookRequest"
      responses:
        "200":
          description: |
            Webhook config saved. The `signing_secret` field is present only
            when this call minted a secret (create, or update with
            `rotate_secret: true`); an update that did not rotate returns the
            config without it.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/VaultWebhookConfigCreatedResponse"
                  - $ref: "#/components/schemas/VaultWebhookConfigResponse"
              examples:
                created_or_rotated:
                  summary: Create or rotate — secret shown once
                  value:
                    url: "https://hooks.example.com/rocketvault"
                    enabled: true
                    created_at: "2026-08-19T12:00:00Z"
                    updated_at: "2026-08-19T12:00:00Z"
                    signing_secret: "b64-encoded-secret-shown-only-now"
                updated_without_rotate:
                  summary: Update without rotating — no secret field
                  value:
                    url: "https://hooks.example.com/rocketvault"
                    enabled: true
                    created_at: "2026-08-19T12:00:00Z"
                    updated_at: "2026-08-19T12:05:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      summary: Get a vault's webhook config
      description: |
        Returns the vault's webhook config. The response never includes the
        signing secret in any form, encrypted or plain — the secret is shown
        exactly once, from the PUT call that minted it.
      operationId: getVaultWebhook
      tags:
        - Vaults
      responses:
        "200":
          description: Webhook config retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultWebhookConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The vault does not exist, or has no webhook config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      summary: Delete a vault's webhook config
      description: Removes the vault's webhook config. Deleting when none exists succeeds.
      operationId: deleteVaultWebhook
      tags:
        - Vaults
      responses:
        "204":
          description: Webhook config deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/vaults/{vault_name}/purge:
    parameters:
      - $ref: "#/components/parameters/VaultName"
    delete:
      summary: Purge a vault
      description: |
        Permanently removes a soft-deleted vault and everything it held. Gated
        purely by the vault-scoped role-assignment check, so even a global admin
        needs an explicit grant (for example Key Vault Purge Operator) in this
        vault. The default vault and purge-protected vaults are refused.
      operationId: purgeVault
      tags:
        - Vaults
      responses:
        "204":
          description: Vault purged successfully
        "400":
          description: The vault is default-protected or purge-protected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ─── Role assignments ──────────────────────────────────────────────────────
  /api/v1/vaults/{vault_name}/role-assignments:
    parameters:
      - $ref: "#/components/parameters/VaultName"
    get:
      summary: List role assignments in a vault
      description: |
        Returns every role assignment scoped to the vault, enriched with the
        principal's username and the number of policies the role expands to.
      operationId: listRoleAssignments
      tags:
        - Role Assignments
      responses:
        "200":
          description: Role assignments retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRoleAssignmentsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Grant a role in a vault
      description: |
        Grants a built-in Azure-parity role to a principal within the vault. The
        principal may be given as a username or a UUID.
      operationId: createRoleAssignment
      tags:
        - Role Assignments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRoleRequest"
      responses:
        "201":
          description: Role assignment created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAssignmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Principal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/vaults/{vault_name}/role-assignments/{assignment_id}:
    parameters:
      - $ref: "#/components/parameters/VaultName"
      - $ref: "#/components/parameters/AssignmentId"
    get:
      summary: Get a role assignment
      description: Returns a single role assignment within the vault.
      operationId: getRoleAssignment
      tags:
        - Role Assignments
      responses:
        "200":
          description: Role assignment retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAssignmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Revoke a role assignment
      description: Removes a role assignment from the vault.
      operationId: deleteRoleAssignment
      tags:
        - Role Assignments
      responses:
        "200":
          $ref: "#/components/responses/StatusOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ─── Secrets (legacy flat routes; resolve to the default vault) ────────────
  /api/v1/secrets:
    get:
      summary: List secrets
      description: |
        Lists the secrets in the resolved vault. Values are omitted. Any vault
        member sees every secret in the vault.
      operationId: listSecrets
      tags:
        - Secrets
      parameters:
        - $ref: "#/components/parameters/Tags"
      responses:
        "200":
          description: Secrets retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSecretsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Create a secret
      description: Stores a new secret. The response omits the secret value.
      operationId: createSecret
      tags:
        - Secrets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSecretRequest"
      responses:
        "201":
          description: Secret created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/secrets/{secret_id}:
    parameters:
      - $ref: "#/components/parameters/SecretId"
    get:
      summary: Get a secret
      description: Returns a secret including its decrypted value.
      operationId: getSecret
      tags:
        - Secrets
      responses:
        "200":
          description: Secret retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Update a secret
      description: |
        Updates a secret and increments its version. At least one changed field
        must be supplied.
      operationId: updateSecret
      tags:
        - Secrets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSecretRequest"
      responses:
        "200":
          description: Secret updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a secret
      description: |
        Soft-deletes a secret; it remains recoverable until purged or until
        retention expires.
