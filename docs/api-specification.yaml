  /api/v1/keys:
    get:
      summary: List keys
      description: |
        Lists the cryptographic keys in the resolved vault, optionally filtered
        by type and tags. Private key material is never returned; the public JWK
        components are included for software-backed keys.
      operationId: listKeys
      tags:
        - Keys
      parameters:
        - name: type
          in: query
          required: false
          description: Filter by key type
          schema:
            type: string
            example: "RSA"
        - $ref: "#/components/parameters/Tags"
      responses:
        "200":
          description: Keys retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Create a key
      description: |
        Generates an RSA, ECDSA, or symmetric (OCT) key. RSA accepts 2048, 3072,
        or 4096 bits (default 2048); ECDSA accepts curves P-256, P-384, P-521,
        or P-256K (default P-256); OCT accepts 128, 192, or 256 bits and
        requires an HSM-backed key provider.
      operationId: createKey
      tags:
        - Keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKeyRequest"
      responses:
        "201":
          description: Key created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

