name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each runner must match its own GOOS/GOARCH — CGO cannot cross-compile.
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
            archive: tar.gz
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
            archive: zip

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${{ github.ref_name }}"
          APP_VERSION=$(./version.sh)
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          GO_VERSION=$(go version | awk '{print $3}')
          BINARY_NAME="rocketvault-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags="-s -w \
              -X 'main.Version=${APP_VERSION}' \
              -X 'main.CommitHash=${COMMIT_HASH}' \
              -X 'main.BuildTime=${BUILD_TIME}' \
              -X 'main.GoVersion=${GO_VERSION}'" \
            -o "dist/${BINARY_NAME}" \
            .

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          BINARY="rocketvault-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          ARCHIVE="${BINARY}.tar.gz"
          tar -czf "dist/${ARCHIVE}" -C dist "${BINARY}"
          # Hash from inside dist so the recorded filename has no path prefix,
          # which lets consumers verify against a bare downloaded archive.
          # sha256sum on Linux, shasum on macOS
          cd dist
          command -v sha256sum >/dev/null 2>&1 && sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256" || shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          BINARY="rocketvault-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          ARCHIVE="rocketvault-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
          7z a "dist/${ARCHIVE}" "dist/${BINARY}"
          # Hash from inside dist so the recorded filename has no path prefix.
          cd dist
          command -v sha256sum >/dev/null 2>&1 && sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256" || shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rocketvault-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  package-docs:
    name: Package Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: scripts/docsgen/go.mod
          cache: true

      - name: Build and package docs
        run: scripts/docs.sh package "${{ github.ref_name }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rocketvault-docs
          path: |
            dist/rocketvault-docs-*.tar.gz
            dist/rocketvault-docs-*.tar.gz.sha256
            dist/rocketvault-docs-*.zip
            dist/rocketvault-docs-*.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, changelog, package-docs]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG_BODY: ${{ needs.changelog.outputs.body }}
        run: |
          VERSION="${{ github.ref_name }}"
          gh release create "${VERSION}" \
            --draft \
            --title "RocketVault ${VERSION}" \
            --notes "${CHANGELOG_BODY}" \
            dist/*.tar.gz dist/*.tar.gz.sha256 \
            dist/*.zip dist/*.zip.sha256

  deploy-railway:
    name: Deploy to Railway
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend (rocketvault)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service rocketvault \
            --environment production \
            --ci \
            -m "Release ${{ github.ref_name }}"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build web dashboard
        working-directory: web
        run: |
          bun install --frozen-lockfile
          # base=/ (not the vite.config.ts default of /app/, which is only
          # correct for local dev behind a Caddy reverse proxy) — Railway
          # serves this service at its own domain root.
          bunx vite build --base=/ --outDir dist --emptyOutDir

      - name: Deploy web dashboard (rocketvault-web)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up web/dist \
            --path-as-root \
            --service rocketvault-web \
            --environment production \
            --ci \
            -m "Release ${{ github.ref_name }}"
