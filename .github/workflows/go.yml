name: Go

on:
  push:
    branches: ["v-4.0.0", "main"]
  pull_request:
    branches: ["v-4.0.0", "main"]

jobs:

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: No owner scope on the data plane
        run: |
          # P2 (Task 11) retired ScopeOwner from the crypto handlers, key
          # delete, and key rotate: every vault-scoped route now builds a
          # model.ScopeVault, gated by vault role membership instead of key
          # ownership. This gate keeps that retirement from silently
          # regressing on those call sites.
          #
          # Exclusions, beyond model/scope.go (defines the constructor itself):
          #   - _test.go              unit tests legitimately hand-build
          #                           ScopeOwner to exercise code paths that
          #                           still accept it (the repository
          #                           predicate, legacy flat routes, cmd/
          #                           tools). This gate is about the data
          #                           plane's production call sites, not
          #                           fixtures -- model/scope_test.go and
          #                           internal/repositories/scope_predicate_test.go
          #                           are covered by this same exclusion.
          #   - secrets/versioning_service.go, secrets/rotation_service.go,
          #     secrets/scheduler_service.go
          #                           secret rollback and the rotation
          #                           scheduler key off the owner
          #                           deliberately; a different subsystem,
          #                           out of P2 scope.
          #   - certificates/certificate_service.go
          #                           certificate auto-renewal; a different
          #                           subsystem, out of P2 scope.
          #
          # api/context.go and api/certificates.go were excluded here until
          # H2 (pentest fix): scopeFromRequest used to fall back to an owner
          # scope for legacy flat routes, and updateCertificate wasn't yet
          # vault-scope aware. Both are fixed now -- scopeFromRequest always
          # returns model.NewVaultScope, and updateCertificate calls it like
          # every other vault-scoped handler -- so api/ is no longer excluded
          # and is fully covered by this gate. Likewise, api/keys.go no
          # longer has any NewOwnerScope call sites (the createKey/rotateKey
          # read-backs were migrated to vault scope), so the former
          # content-based exclusion for that read-back is gone too.
          #
          # cmd/ was excluded here until the keys/certs CLI --vault wiring
          # landed: every cmd/keys and cmd/certificates command now resolves a
          # real vault and builds model.NewVaultScope (see
          # .claude/multi-vault.md's "Known deferrals" refresh), so cmd/ is no
          # longer excluded either.
          if grep -rn "NewOwnerScope\|ownerScopeFromRequest" --include="*.go" . \
               | grep -v "_test.go" \
               | grep -v "model/scope.go" \
               | grep -v "internal/services/secrets/versioning_service.go" \
               | grep -v "internal/services/secrets/rotation_service.go" \
               | grep -v "internal/services/secrets/scheduler_service.go" \
               | grep -v "internal/services/certificates/certificate_service.go"; then
            echo "owner scope reached the data plane; P2 retired it" >&2
            exit 1
          fi

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    # Temporarily disabled — flip `if` back to remove this line to re-enable.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  scope-gate:
    name: Scope API Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No legacy InVault/ByOwner methods
        run: |
          # internal/services/secrets/rotation_service.go and
          # internal/repositories/rotation_repository.go are excepted: the
          # rotation subsystem intentionally still keys off user_id via
          # ListByUser. This is a permanent, documented deferral (secondary
          # subsystems are out of scope for the P1 scope refactor per the
          # plan's own corrections section), not a legacy pattern to migrate.
          #
          # internal/services/authorization/role_assignment_service.go and
          # internal/repositories/role_assignment_repository.go are excepted
          # for a different reason: ListByPrincipalInVault is not one of the
          # P1-refactored secrets/keys/certificates data-plane repositories
          # this gate targets. It's the per-vault role-assignment lookup that
          # *grants* scope-based access in the first place -- a naming
          # coincidence with the retired GetXInVault/ListXInVault pattern,
          # not a regression of it.
          if grep -rn "InVault\|ReadByOwner\|ListByUser(" --include="*.go" . | grep -v "_test.go" | grep -v "^./internal/services/secrets/rotation_service.go" | grep -v "^./internal/repositories/rotation_repository.go" | grep -v "^./internal/services/authorization/role_assignment_service.go" | grep -v "^./internal/repositories/role_assignment_repository.go"; then
            echo "::error::legacy vault-scoping methods reintroduced; use model.Scope"
            exit 1
          fi

      - name: No transitional Scoped suffix
        run: |
          if grep -rnE "(Read|Update|List)Scoped|(Get|List|Update|Delete)(Secret|Secrets|Key|Keys|Certificate|Certificates)Scoped|(Recover|Purge)SecretScoped|Get(Version|Versions|LatestVersion)Scoped" --include="*.go" .; then
            echo "::error::transitional Scoped suffix survived the Phase 6 rename"
            exit 1
          fi

      - name: No hand-built Scope literals
        run: |
          # Bans POPULATED literals only. The zero value, model.Scope{}, is
          # ScopeInvalid -- the deliberate fail-closed sentinel -- and tests
          # legitimately construct it to assert that an uninitialised scope is
          # rejected (internal/repositories/rotation_scope_test.go,
          # scoped_crud_test.go). api/context.go returns it on the error path
          # too, which is why no path exclusion is needed any more.
          # The |$ alternative catches a literal opened at end of line:
          #   model.Scope{
          #       kind: ...,
          #   }
          # Single quotes keep the shell away from the $).
          if grep -rnE 'model\.Scope\{([^}]|$)' --include="*.go" .; then
            echo "::error::construct scopes with NewVaultScope/NewOwnerScope/NewAdminScope"
            exit 1
          fi

  mcp-gate:
    name: MCP Capability Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The exposed tool surface must match the configuration exactly, for
      # every flag combination. This is the invariant that breaks silently
      # when a tool is added under the wrong tier: nothing else in the suite
      # notices, and the first person to find out is whoever runs the server.
      - name: Capability gating table
        run: go test ./internal/mcpserver/ -run TestGatingTable_ -race -v

      # No tool may return secret material while allow_secret_values is off,
      # in raw or base64 form.
      - name: Secret-material leak sweep
        run: go test ./internal/mcpserver/ -run TestLeakSweep_ -race -v

      # register() sets the MCP annotations that let a host prompt before a
      # destructive call. A tool added through mcp.AddTool directly would
      # bypass that, along with the deadline, rate limit and correlation id.
      - name: No direct mcp.AddTool calls outside register
        run: |
          if grep -rn "mcp\.AddTool(" --include="*.go" internal/mcpserver/ \
              | grep -v "_test.go" \
              | grep -v "server.go"; then
            echo "mcp.AddTool must only be called from register() in server.go."
            echo "Direct calls lose the deadline, panic recovery, correlation id,"
            echo "rate limit and destructive annotations all at once."
            exit 1
          fi

      # discloseValue is the single egress point for secret values.
      - name: Only redact.go reveals secret values
        run: |
          if grep -rn "\.Reveal()" --include="*.go" internal/mcpserver/ \
              | grep -v "_test.go" \
              | grep -v "redact.go" \
              | grep -v "tools_crypto.go"; then
            echo "SecretValue.Reveal() may only be called from redact.go, and from"
            echo "tools_crypto.go's decrypt handler, which is gated on both"
            echo "allow_crypto and allow_secret_values."
            exit 1
          fi

  mcp-integration:
    name: MCP Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The harness generates a TOTP code for the provisioned admin's login,
      # since local login always requires one.
      - name: Install oathtool
        run: sudo apt-get update && sudo apt-get install -y oathtool

      # Runs the MCP server against a real RocketVault instance. The unit
      # suite cannot catch a misread wrapper key or field name, because its
      # fakes were written by whoever wrote the code reading them -- both
      # would carry the same mistake and agree. This is the check on that.
      - name: MCP integration suite
        run: go test -tags=integration ./internal/mcpserver/ -v -timeout 10m

  security:
    name: Security Scan
    # Temporarily disabled — flip `if` back to remove this line to re-enable.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ""   # reads from go.mod
          go-package: ./...

      - name: No tracked RocketVault config files
        run: |
          # H4 (.claude/known-bugs.md § B10): a real .rocketvault.yaml was
          # tracked in git for 5+ months because the .gitignore pattern
          # meant to catch it never matched. This is the structural half of
          # that fix — it must never be trackable again, under any of its
          # sibling names either. The final whole-branch review flagged that
          # the original regex only covered dash-separated siblings
          # (.rocketvault-production.yaml) and missed dot-separated ones
          # (.rocketvault.prod.yaml) -- the same class of gap that caused the
          # original incident. `[.-]` now covers both separators, and
          # .rocketvault.yaml.example stays excluded because the pattern
          # requires the string to end in ".yaml".
          if git ls-files | grep -E '^\.rocketvault([.-].*)?\.yaml$|^\.rocketvault\.yaml\.local$'; then
            echo "::error::a real RocketVault config file is tracked in git — see .claude/known-bugs.md § B10" >&2
            exit 1
          fi

      - name: No known-compromised secret literals
        run: |
          # The specific values leaked by H4 and its 2026-03-07 predecessor.
          # This is a denylist of exact, already-compromised bytes, not a
          # general secret scanner — see the design doc for why (gitleaks
          # produced 50 findings here, nearly all false positives on test
          # fixtures; this check produces zero by construction). Docs that
          # intentionally discuss these values as history are excluded.
          #
          # Exclusions, beyond docs/superpowers/, docs/plans/, and .claude/:
          #   - bootstrap/bootstrap_test.go, cmd/master_key_test.go,
          #     common/masterkey_test.go,
          #     internal/services/auth/jwt_service_provider_test.go
          #     regression tests (from the H1/H3 sibling plans) that assert
          #     RocketVault REJECTS the compromised master key / jwt_secret.
          #     They must embed the actual leaked value to test the
          #     rejection path (e.g. TestValidateMasterKey_RejectsCompromisedDefault)
          #     — removing the literal here would break the test they exist
          #     to run.
          #   - doc/README_ADMIN_SETUP.md, doc/README_ADMIN_SETUP.html
          #     H1 (a sibling plan) intentionally left the leaked jwt_secret
          #     in place here as a worked example, annotated "unread since
          #     2026-08-16; removal tracked separately" rather than deleted.
          #     Out of this plan's (H4's) scope to alter.
          #   - .github/workflows/go.yml
          #     this file: the check necessarily quotes each literal in its
          #     own `-e` patterns, which otherwise self-matches.
          if git grep -lF \
              -e '***SECRET-REMOVED-2026-08-17***' \
              -e '***SECRET-REMOVED-2026-08-17***' \
              -e '***SECRET-REMOVED-2026-08-17***' \
              -e '***SECRET-REMOVED-2026-08-17***' \
              -e '***SECRET-REMOVED-2026-08-17***' \
              -e '***SECRET-REMOVED-2026-08-17***' \
              -- . ':(exclude)docs/superpowers/' ':(exclude)docs/plans/' ':(exclude).claude/' \
                 ':(exclude)bootstrap/bootstrap_test.go' ':(exclude)cmd/master_key_test.go' \
                 ':(exclude)common/masterkey_test.go' \
                 ':(exclude)internal/services/auth/jwt_service_provider_test.go' \
                 ':(exclude)doc/README_ADMIN_SETUP.md' ':(exclude)doc/README_ADMIN_SETUP.html' \
                 ':(exclude).github/workflows/go.yml'; then
            echo "::error::a known-compromised secret literal (rotated 2026-08-16) reappeared in a tracked file — see .claude/known-bugs.md § B10" >&2
            exit 1
          fi
