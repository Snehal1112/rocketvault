# Runs RocketVault against PostgreSQL.
#
# Connection string format: the rocketvault service renders
# .rocketvault.docker.yaml.tmpl into .rocketvault.yaml at startup (see
# docker-entrypoint.sh), producing a "postgres://" URL DSN. That prefix is
# recognized by sniffDriver() in internal/db/db.go and routes the connection
# through the Postgres Dialect in internal/db/dialect.go (placeholder
# rebinding, upsert syntax, column-existence checks, etc).
#
# Quick start:
#   cp .env.example .env   # then fill in every value (see .env.example)
#   docker compose up --build
#
# Then create the first admin user (see CLAUDE.md "Admin User Setup"),
# using the RV_BOOTSTRAP_TOKEN value from your .env:
#   docker compose exec rocketvault /app/rocketvault users admin \
#     --admin-username=admin --admin-password=<password> \
#     --bootstrap-token=<RV_BOOTSTRAP_TOKEN from .env>
#
# Optional TLS-terminating reverse proxy (bare VPS deployments; skip this on
# Fly.io, which terminates TLS itself). Edit Caddyfile's placeholder domain
# first, then bring it up with the "proxy" profile:
#   docker compose --profile proxy up --build
#
# Optional Prometheus scraper (see prometheus.yml), on its own profile:
#   docker compose --profile metrics up --build
# Then check the target is UP at http://localhost:9090/targets.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rocketvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-rocketvault}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rocketvault} -d ${POSTGRES_DB:-rocketvault}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - rocketvault_net

  rocketvault:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # NOTE: --listen is passed explicitly because cmd/serve.go reads
    # server.listen_addr in its init() function, which runs before viper has
    # loaded the config file (cobra.OnInitialize fires later). The YAML value
    # is therefore silently ignored and the binary falls back to its
    # hardcoded default "127.0.0.1:8774", which is unreachable from outside
    # the container. This is a pre-existing app bug independent of Postgres
    # support; --listen on the CLI takes precedence and works around it.
    command: ["/app/rocketvault", "serve", "--listen", ":8774"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # RV_DB_DRIVER selects which template docker-entrypoint.sh renders;
      # explicit here since the entrypoint's own default is sqlite3.
      RV_DB_DRIVER: postgres
      # Consumed by docker-entrypoint.sh to render the Postgres DSN and
      # secrets into .rocketvault.yaml. POSTGRES_* must match the postgres
      # service above. The entrypoint refuses to start if any are unset.
      POSTGRES_USER: ${POSTGRES_USER:-rocketvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-rocketvault}
      RV_MASTER_KEY: ${RV_MASTER_KEY:?RV_MASTER_KEY is required, see .env.example}
      RV_BOOTSTRAP_TOKEN: ${RV_BOOTSTRAP_TOKEN:?RV_BOOTSTRAP_TOKEN is required, see .env.example}
      RV_ISSUER: ${RV_ISSUER:-http://localhost:8774}
      RV_CORS_ORIGINS: ${RV_CORS_ORIGINS:-http://localhost:8774}
      # RV_HSM_ENABLED=true initializes a SoftHSM2 software token in the
      # container and sets hsm.enabled: true; RV_HSM_PIN/RV_HSM_SO_PIN are
      # only used when it's true. Default: false. See
      # docs/hsm-softhsm2-testing.md.
      RV_HSM_ENABLED: ${RV_HSM_ENABLED:-false}
      RV_HSM_PIN: ${RV_HSM_PIN:-}
      RV_HSM_SO_PIN: ${RV_HSM_SO_PIN:-}
      # Reverse proxies whose X-Forwarded-For may be trusted, rendered into
      # server.trusted_proxies. Default: empty (trust nothing). With the
      # "proxy" profile, set it to the rocketvault_net subnet Caddy connects
      # from (see `docker network inspect`), or every client shares one login
      # rate-limit bucket. Format and examples: .env.example.
      RV_TRUSTED_PROXIES: ${RV_TRUSTED_PROXIES:-}
    volumes:
      - ./.rocketvault.docker.yaml.tmpl:/app/.rocketvault.docker.yaml.tmpl:ro
      - rocketvault_logs:/app/logs
    ports:
      - "${ROCKETVAULT_PORT:-8774}:8774"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8774/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - rocketvault_net

  # Optional Prometheus scraper for RocketVault's GET /metrics endpoint, plus
  # Rocket-mem's metrics (see prometheus.yml's rocket-mem job) when that's
  # running on the host alongside a manual Caddyfile.local. Not started by a
  # plain "docker compose up" -- requires --profile metrics:
  #
  #   docker compose --profile metrics up --build
  #
  # Scrapes rocketvault:8774/metrics over rocketvault_net, so nothing extra
  # needs publishing. /metrics carries no authentication (it is registered on
  # the root router to bypass the middleware chain), and it exposes vault
  # names via the rocketvault_vault_rate_limit_exceeded_total label -- so on a
  # public host, restrict the published Prometheus port below, or drop it and
  # reach the UI through an SSH tunnel.
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    profiles: ["metrics"]
    depends_on:
      rocketvault:
        condition: service_healthy
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - rocketvault_net
    extra_hosts:
      # Resolves for the rocket-mem job in prometheus.yml, which scrapes
      # Rocket-mem's metrics through the host's own Caddy TLS listener --
      # see that job's comment for why it can't be reached any other way.
      - "numericlabs.lxd:host-gateway"

  # Optional TLS-terminating reverse proxy. Not started by a plain
  # "docker compose up" -- requires --profile proxy, since Caddyfile's
  # placeholder domain must be edited to a real one first (Caddy will
  # otherwise fail to obtain a Let's Encrypt certificate).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["proxy"]
    depends_on:
      rocketvault:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - rocketvault_net

volumes:
  postgres_data:
  rocketvault_logs:
  prometheus_data:
  caddy_data:
  caddy_config:
  caddy_logs:

networks:
  rocketvault_net:
    driver: bridge
