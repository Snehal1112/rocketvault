# fly.toml — Fly.io deployment configuration for RocketVault
#
# Quick start:
#   1. Install flyctl: https://fly.io/docs/hands-on/install-flyctl/
#   2. fly auth login
#   3. fly launch --no-deploy          # creates the app, skips first deploy
#   4. fly postgres create             # provision managed Postgres
#   5. fly postgres attach <pg-app>    # injects DATABASE_URL — not used
#      # Instead set individual vars (the entrypoint uses POSTGRES_* not DATABASE_URL):
#      fly secrets set \
#        RV_DB_DRIVER=postgres \
#        POSTGRES_USER=rocketvault \
#        POSTGRES_PASSWORD="$(openssl rand -base64 24)" \
#        POSTGRES_DB=rocketvault \
#        RV_MASTER_KEY="$(openssl rand -base64 32)" \
#        RV_BOOTSTRAP_TOKEN="$(openssl rand -base64 32)" \
#        RV_ISSUER="https://<your-app>.fly.dev" \
#        RV_CORS_ORIGINS="https://<your-app>.fly.dev"
#      Fly's edge proxy sits in front of the app, so also set
#      RV_TRUSTED_PROXIES to the address ranges Fly's proxy connects from
#      (take them from Fly's own documentation), each double-quoted and
#      comma-separated, e.g. RV_TRUSTED_PROXIES='"<range-1>","<range-2>"'.
#      Unset, every client shares one login rate-limit bucket.
#   6. fly deploy
#   7. Create first admin:
#      fly ssh console -C \
#        "/app/rocketvault users admin --admin-username=admin --admin-password=<pw> --bootstrap-token=<RV_BOOTSTRAP_TOKEN>"
#
# Note on Postgres connection string:
#   The .rocketvault.docker.yaml.tmpl template builds the DSN from
#   POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB as:
#     postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
#   On Fly, replace "postgres" (compose service name) with the private IPv6
#   address or internal hostname of your Fly Postgres app, e.g.:
#     <pg-app-name>.internal
#   Update the template's database.connection line accordingly, or override
#   it by mounting a separate config via a Fly volume.

app      = "rocketvault"           # change to your Fly app name
primary_region = "iad"             # choose the region closest to your users

[build]
  dockerfile = "Dockerfile"

# RocketVault serves on :8774. Fly terminates TLS and forwards HTTP/2.
[http_service]
  internal_port       = 8774
  force_https         = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 1         # keep at least one instance warm

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 200
    hard_limit = 250

# Single machine — RocketVault is a single-vault system. Multiple replicas
# would race on schema migrations at startup. Scale vertically, not horizontally.
[[vm]]
  size   = "shared-cpu-1x"        # 256 MB RAM; upgrade to "shared-cpu-2x" for prod
  memory = "512mb"

# Persistent volume for logs (optional — remove if you ship logs externally).
[[mounts]]
  source      = "rocketvault_logs"
  destination = "/app/logs"

# Health checks — Fly will restart the machine if these fail.
[[http_checks]]
  grace_period   = "15s"
  interval       = "30s"
  method         = "GET"
  path           = "/api/v1/health/live"
  port           = 8774
  timeout        = "5s"
  tls_skip_verify = false
